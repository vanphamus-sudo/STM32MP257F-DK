# Standalone example. end0 was discovered on the installed ST image.
interface=end0
listen-address=192.168.10.1
bind-dynamic
domain-needed
bogus-priv
dhcp-range=192.168.10.50,192.168.10.200,255.255.255.0,12h
dhcp-option=option:router,192.168.10.1
dhcp-option=option:dns-server,192.168.10.1
# Explicit upstreams avoid a loop through a local stub resolver.
no-resolv
server=1.1.1.1
server=8.8.8.8
