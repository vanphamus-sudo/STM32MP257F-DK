<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Router live log</title><link rel="stylesheet" href="/style.css"><script src="/logs.js" defer></script></head><body data-log-window="true"><main class="log-window"><section class="card"><h1>Live Log</h1><p><a href="/#local-log-panel" target="_blank" rel="noopener">Router settings / sign in</a></p><div id="logs-viewer">
<div class="pair"><label>Log category<select id="logs-category"><option value="message">Message</option><option value="application">Application</option><option value="kernel">Kernel</option><option value="audit">Audit</option></select></label><label>Log source<select id="logs-source"><option value="buffer">Current buffer</option><option value="file">Saved local file</option></select></label></div>
<div class="pair"><label>Search<input id="logs-search" maxlength="100" type="search" placeholder="Filter displayed records"></label><label>Lines<select id="logs-lines"><option value="100">100</option><option value="300" selected>300</option><option value="1000">1000</option></select></label></div>
<div class="log-actions"><label><input id="logs-live" type="checkbox" checked> Live updates every 2 seconds</label><label><input id="logs-autoscroll" type="checkbox" checked> Follow newest records</label><button id="logs-refresh" type="button" class="secondary">Refresh</button><button id="logs-download" type="button" class="secondary">Download displayed log</button></div>
<p id="logs-status" role="status">Ready</p><pre id="logs-output" class="log-output" tabindex="0" aria-label="Log records"></pre><p id="logs-note" class="muted"></p>
</div></section></main></body></html>
